name: Claude Code Review

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  GH_TOKEN_VALUE: ${{ secrets.GH_TOKEN }}
  CLAUDE_MODEL: claude-sonnet-4-6

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip when Claude secrets are not configured
        if: ${{ env.ANTHROPIC_API_KEY == '' || env.ANTHROPIC_BASE_URL == '' || env.GH_TOKEN_VALUE == '' }}
        run: echo "Claude Code review secrets are not configured; skipping Claude Code Review."

      - name: Checkout repository
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' && env.GH_TOKEN_VALUE != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' && env.GH_TOKEN_VALUE != '' }}
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this BetterAINote pull request and focus on:
            - Code correctness, runtime safety, and provider boundary regressions
            - Test coverage and whether verification is sufficient
            - Secret hygiene and public documentation safety
            - Bun/Next.js workflow consistency
            - SQLite/search/schema compatibility

            Use Bun as the package/runtime baseline. Flag pnpm, npm, Yarn,
            package-lock, or pnpm-lock regressions.
            Watch for leaked tokens, cookies, HAR files, private recordings,
            private transcripts, provider identifiers, local private paths, and
            implementation-only provider wording.
            Treat missing tests, broken provider contracts, unsafe
            database/search migrations, and UI regressions as high-signal findings.

            The PR branch is already checked out in the current working directory.
            Always post one top-level review summary with `gh pr comment`, even when there are no actionable findings.
            If there are no actionable findings, say that explicitly in the top-level comment.
            Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true` for specific changed-line issues.
            Prefer concrete file/line findings over broad summaries.
            Only post GitHub comments; do not leave review text only in the action transcript.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(rg:*),Bash(bun install --frozen-lockfile --ignore-scripts),Bash(bun run format-and-lint),Bash(bun run type-check),Bash(bun run test),Bash(bun run build)"
