name: Claude Code Review

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  CLAUDE_MODEL: claude-sonnet-4-6

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip when Claude secrets are not configured
        if: ${{ env.ANTHROPIC_API_KEY == '' || env.ANTHROPIC_BASE_URL == '' }}
        run: echo "Claude Code review secrets are not configured; skipping Claude Code Review."

      - name: Checkout repository
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          exclude_comments_by_actor: MapleEve,github-actions,codecov,sourcery-ai,copilot-pull-request-reviewer
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this BetterAINote pull request and focus on:
            - Code correctness, runtime safety, and provider boundary regressions
            - Test coverage and whether verification is sufficient
            - Secret hygiene and public documentation safety
            - Bun/Next.js workflow consistency
            - SQLite/search/schema compatibility

            Use Bun as the package/runtime baseline. Flag pnpm, npm, Yarn,
            package-lock, or pnpm-lock regressions.
            Watch for leaked tokens, cookies, HAR files, private recordings,
            private transcripts, provider identifiers, local private paths, and
            implementation-only provider wording.
            Treat missing tests, broken provider contracts, unsafe
            database/search migrations, and UI regressions as high-signal findings.

            The PR branch is already checked out in the current working directory.
            Post feedback only through the official Claude Code Action GitHub integration.
            Do not use the GitHub CLI and do not use a user-owned GitHub token.
            If the official Claude GitHub App integration is unavailable, fail instead of posting as the repository owner.
            If there are no actionable findings, post the standard no-findings confirmation through the action integration.
            Prefer concrete file/line findings over broad summaries.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Bash(bun install --frozen-lockfile --ignore-scripts),Bash(bun run format-and-lint),Bash(bun run type-check),Bash(bun run test),Bash(bun run build),Bash(rg:*),Bash(git diff:*)"
