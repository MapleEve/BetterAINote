name: BetterAINote Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to generate BetterAINote release notes for (e.g. v0.1.0)'
        required: true
      allow_release:
        description: "Temporarily disabled before the first public release. Set true only when release publishing is approved."
        required: true
        default: false
        type: boolean

jobs:
  release:
    if: ${{ github.event.inputs.allow_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out BetterAINote
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "current=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous tag
        id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')
          if [ -z "$PREV" ]; then
            # First BetterAINote release: use initial commit once releases are approved.
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          RELEASE_TAG: ${{ steps.tag.outputs.current }}
        run: |
          args=(--field "tag_name=$RELEASE_TAG")
          if [[ "$PREVIOUS_TAG" == v* ]]; then
            args+=(--field "previous_tag_name=$PREVIOUS_TAG")
          fi
          notes_json=$(gh api "repos/${{ github.repository }}/releases/generate-notes" "${args[@]}")
          {
            echo "release-notes<<RELEASE_NOTES"
            echo "$notes_json" | jq -r ".body"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.current }}
          name: ${{ steps.tag.outputs.current }}
          body: ${{ steps.notes.outputs.release-notes }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
