coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
    patch:
      default:
        target: 80%
        threshold: 0%

ignore:
  - "src/tests/**"
  - "e2e/**"
  - "tmp/**"
  - "storage/**"
  - "audio/**"
  - "data/**"
  - ".next/**"
  - "drizzle/**"
  - "docs/assets/**"
