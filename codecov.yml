coverage:
  status:
    project:
      default:
        informational: false
        target: 80%
        threshold: 0%
        paths:
          - "src/features/settings/"
          - "src/lib/data-sources/"
          - "src/lib/search/"
          - "src/lib/settings/"
          - "src/server/modules/data-sources/"
          - "src/server/modules/search/search-repository.ts"
          - "src/server/modules/search/segmenter.ts"
          - "src/server/modules/settings/"
          - "src/services/"
    patch:
      default:
        informational: false
        target: 70%
        threshold: 0%

ignore:
  - "src/tests/**"
  - "src/app/**"
  - "src/components/**"
  - "src/db/**"
  - "src/features/dashboard/**"
  - "src/features/data-sources/**"
  - "src/features/recordings/**"
  - "src/features/settings/components/**"
  - "src/hooks/**"
  - "src/lib/*.ts"
  - "src/lib/ai/**"
  - "src/lib/api-credentials/**"
  - "src/lib/platform/**"
  - "src/lib/storage/**"
  - "src/lib/sync/**"
  - "src/lib/transcription/**"
  - "src/lib/voice-transcribe/**"
  - "src/server/modules/onboarding/**"
  - "src/server/modules/recording-tags/**"
  - "src/server/modules/recordings/**"
  - "src/server/modules/registration/**"
  - "src/server/modules/search/index.ts"
  - "src/server/modules/search/index-writer.ts"
  - "src/server/modules/search/indexer.ts"
  - "src/server/modules/search/job-processor.ts"
  - "src/server/modules/search/queries.ts"
  - "src/server/modules/search/rebuild-cli.ts"
  - "src/server/modules/search/rebuild.ts"
  - "src/server/modules/speakers/**"
  - "src/worker/**"
  - "e2e/**"
  - "tmp/**"
  - "storage/**"
  - "audio/**"
  - "data/**"
  - ".next/**"
  - "drizzle/**"
  - "docs/assets/**"
